# Publishes a GitHub release when a `vX.Y.Z` tag is pushed.
# The notes are the CHANGELOG.md section for that version.
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches DEV_VERSION
        run: |
          version="$(./bin/dev --version | sed 's/^dev //')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match DEV_VERSION $version in bin/dev"
            exit 1
          fi

      - name: Extract release notes
        run: |
          awk -v want="## ${GITHUB_REF_NAME#v}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
